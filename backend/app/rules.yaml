# Business rules & tolerances. Every processing run stores a snapshot of the
# effective rules, so a decision can always be traced to the rules it used.
# Values here are defaults; overrides saved via the Settings page are layered on top.

tolerances:
  quantity_pct: 0            # invoiced qty may not exceed remaining PO qty
  unit_price_pct: 5          # unit price may be up to 5% above PO price
  total_amount_pct: 5        # cumulative invoiced value vs PO value
  rounding_abs: 0.05         # qty x price vs line total
  tax_abs_per_line: 0.50     # rounding allowance for tax, per line
  tax_abs_header: 1.00       # rounding allowance for tax, header level
  subtotal_abs: 1.00         # sum(lines) vs subtotal
  grand_total_abs: 1.00      # subtotal - discount + tax + shipping vs grand total

extraction:
  min_confidence: 0.80       # below this a field is UNCERTAIN
  critical_fields: [vendor_identity, invoice_number, invoice_date, grand_total]

dates:
  max_future_days: 0         # invoice dated in the future -> review
  max_age_days: 365          # older than this -> review
  max_days_after_po: 365     # invoice this long after PO date gets no date-fit credit

policy:
  unapproved_vendor: MANUAL_REVIEW   # BLOCKED / PENDING vendors: MANUAL_REVIEW (flagged) or REJECT
  unknown_vendor: MANUAL_REVIEW
  currency_mismatch: MANUAL_REVIEW
  cancelled_po: REJECT
  closed_po_no_balance: REJECT
  closed_po_with_balance: MANUAL_REVIEW
  qty_exceeds_remaining: REJECT
  price_over_tolerance: MANUAL_REVIEW
  total_over_tolerance: MANUAL_REVIEW
  allow_under_billing: true          # lower price / partial qty is not a violation
  # AP controls (MANUAL_REVIEW or REJECT; the two marked FLAG may also be FLAG = shown, no review)
  above_approval_limit: MANUAL_REVIEW   # routed to a manager; only a manager can approve it
  near_limit: FLAG                      # just under the auto-approval limit
  split_below_limit: MANUAL_REVIEW      # several just-under-limit invoices from one vendor in a short window
  bank_details_changed: MANUAL_REVIEW
  unusual_amount: MANUAL_REVIEW
  invoice_before_po: MANUAL_REVIEW
  month_end_arrival: FLAG
  einvoice_missing: MANUAL_REVIEW       # vendor must e-invoice but no IRN / QR code
  einvoice_mismatch: MANUAL_REVIEW      # IRN invalid, or QR code contradicts the printed invoice
  note_without_original: MANUAL_REVIEW  # credit/debit note whose original invoice is unknown or not approved
  credit_exceeds_original: MANUAL_REVIEW
  debit_note: MANUAL_REVIEW             # a vendor debit note raises what we owe - buyer confirms it

approval:
  # Gross amount (invoice currency) up to which an invoice may be approved automatically.
  # Above it the invoice goes to review and only a manager can approve it. Credit notes are exempt.
  auto_approve_limit:
    INR: 500000
    EUR: 15000
    USD: 15000
  # Who may approve an invoice the limit sends to review (above the limit, no limit for its currency,
  # or a suspected split): REVIEWER (reviewer or manager) or MANAGER (manager only).
  above_limit_approver: REVIEWER
  near_limit_pct: 5           # within 5% below the limit counts as "just under"
  split_window_days: 30       # look-back for other just-under-limit invoices from the same vendor

fraud:
  unusual_amount_multiple: 3  # more than 3x the vendor's median invoice ...
  unusual_amount_min_history: 3  # ... once at least this many earlier invoices exist
  month_end_days: 2           # received in the last 2 days of a month

notes:
  amount_abs: 1.00            # rounding allowance when comparing a note with its original invoice
  line_min_similarity: 0.60   # credit-note line -> original invoice line

einvoice:
  enabled: true               # GST e-invoicing checks (India). Vendors flagged in master data must send IRN + QR.

tds:
  # Indian TDS withheld from the vendor payment. Base = value excluding GST. Rates/thresholds are
  # configurable defaults - confirm them with your tax team for the current financial year.
  enabled: true
  sections:
    "194C": {rate: 2, single_threshold: 30000, annual_threshold: 100000, excess_only: false}   # contractors
    "194J": {rate: 10, single_threshold: 0, annual_threshold: 50000, excess_only: false}       # professional / technical
    "194I": {rate: 10, single_threshold: 0, annual_threshold: 600000, excess_only: false}      # rent
    "194Q": {rate: 0.1, single_threshold: 0, annual_threshold: 5000000, excess_only: true}     # purchase of goods

matching:
  select_min_score: 70       # top candidate must score at least this
  select_margin: 15          # ...and lead the runner-up by this many points
  line_min_similarity: 0.60  # line pairs below this are "unmatched"
  min_description_evidence: 0.50  # selected PO needs description/code evidence >= 50% of its weight
  require_semantic_for_auto_select: true  # without the AI meaning signal, inferred matches go to review
  fuzzy_po_max_edits: 1      # "PO-2O01" -> "PO-2001" (OCR) is accepted with a warning
  weights:
    semantic: 30             # AI: meaning of descriptions
    lexical: 10              # code: wording similarity (rapidfuzz)
    item_code: 15
    qty_price: 20
    amount: 15
    date: 10

duplicates:
  probable_threshold: 0.75
  invoice_no_max_edits: 2
  amount_abs: 1.00
  date_window_days: 3
  weights:
    invoice_number: 0.30
    date: 0.15
    amount: 0.20
    po_reference: 0.10
    line_items: 0.15
    fingerprint: 0.10

company:
  # Our own tax IDs (the buyer). Never mistaken for the vendor's tax ID.
  tax_ids: ["27AABCM1234F1ZX"]
  name: "Acme Manufacturing Pvt Ltd"
