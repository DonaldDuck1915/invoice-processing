# Render Blueprint: API (Docker, with Tesseract) + Postgres.
# The frontend is deployed separately on Vercel (see README).
databases:
  - name: invoice-ai-db
    plan: free
    databaseName: invoice_ai
    user: invoice_ai

services:
  - type: web
    name: invoice-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-ai-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: ALLOW_DEMO_RESET
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: REVIEWER_USERNAME
        value: reviewer
      - key: REVIEWER_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
