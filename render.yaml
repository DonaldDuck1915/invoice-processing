# Render Blueprint: API (Docker, with Tesseract) + Postgres.
# The frontend is deployed separately on Vercel (see README).
databases:
  - name: invoice-ai-db
    plan: free
    databaseName: invoice_ai
    user: invoice_ai

services:
  - type: web
    name: invoice-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-ai-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING
        value: auto
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: ALLOW_DEMO_RESET
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REVIEWER_USERNAME
        value: reviewer
      - key: REVIEWER_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
